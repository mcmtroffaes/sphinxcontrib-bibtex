name: build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        pip-sphinx: ['sphinx']
        pytest-options: ['']
        include:
          # numpydoc tests
          - python-version: '3.14'
            pip-sphinx: 'sphinx https://github.com/numpy/numpydoc/archive/refs/heads/master.zip'
            pytest-options: '-m "numpydoc"'
          # rinohtype tests
          - python-version: '3.14'
            pip-sphinx: 'sphinx https://github.com/brechtm/rinohtype/archive/refs/heads/master.zip'
            pytest-options: '-m "rinohtype"'
          # cython tests
          - python-version: '3.14'
            pip-sphinx: 'sphinx test/some_cython_module'
            pytest-options: '-m "cython"'
          # latest of sphinx 7.x series
          - python-version: '3.12'
            pip-sphinx: '"sphinx<8"'
            pytest-options: ''
          # latest of sphinx 8.x series
          - python-version: '3.13'
            pip-sphinx: '"sphinx<9"'
            pytest-options: ''
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest codecov coverage
        python -m pip install . sphinx-autoapi ${{ matrix.pip-sphinx }}
    - name: Install extra dependencies
      run: |
        python -m pip install flake8 mypy types-docutils
      if: matrix.pip-sphinx == 'sphinx' && matrix.python-version == '3.14'
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source
        flake8 . --count --max-complexity=10
      if: matrix.pip-sphinx == 'sphinx' && matrix.python-version == '3.14'
    - name: Type checking with mypy
      run: mypy
      if: matrix.pip-sphinx == 'sphinx' && matrix.python-version == '3.14'
    - name: Documentation
      run: |
        pushd doc && make html && popd
      if: matrix.pip-sphinx == 'sphinx' && matrix.python-version == '3.14'
    - name: Test with pytest
      run: |
        coverage run -m pytest ${{ matrix.pytest-options }}
    - uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
